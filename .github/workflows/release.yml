name: Release

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type publish to release the package
        required: true

permissions:
  contents: read

jobs:
  npm:
    if: github.event.inputs.confirm == 'publish'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install
        run: npm ci

      - name: Check
        run: npm run check

      - name: Benchmark
        run: npm run bench

      - name: Pack dry run
        run: npm pack --dry-run

      - name: Publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
